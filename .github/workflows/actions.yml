name: Run Dump.py

on:
  schedule:
    # Run once per day at 00:30 UTC (6:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch:

concurrency:
  group: dump-job
  cancel-in-progress: false

jobs:
  run-dump:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Dump.py
        env:
          PRABHAT_SECRET_KEY: ${{ secrets.PRABHAT_SECRET_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          USERNAME: ${{ secrets.USERNAME }}
          METABASE_URL: ${{ secrets.METABASE_URL }}
          DAILY_DUMP_QUERY: ${{ secrets.DAILY_DUMP_QUERY }}
          DS_ALL_LEAD_STAGES_DOD: ${{ secrets.DS_ALL_LEAD_STAGES_DOD }}
          SHEET_ACCESS_KEY: ${{ secrets.SHEET_ACCESS_KEY }}

        run: |
          echo "Workflow triggered at UTC: $(date -u)"
          echo "🚀 Running Dump.py..."
          python Dump.py
